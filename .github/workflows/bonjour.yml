name: "Bonjour CI"

on: push

jobs:
  bonjour:
    runs-on: ubuntu-latest
    steps:
      - name: Dire bonjour
        run: echo "Bonjour depuis un runner GitHub !"
      
      - name: Présenter la machine
        run: |
          date
          uname -a
          python3 --version
          nproc
          ls -la

      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Verifier la récupération
        run: ls -la